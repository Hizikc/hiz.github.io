<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiz - Ссылки</title>
    <style>
        /* Базовые стили страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* КОНТЕЙНЕР ДЛЯ ЧАСТИЦ (ЗВЕЗД) */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1; /* Уводит на задний план */
        }

        /* КОНТЕЙНЕР ДЛЯ РАЗРАБОТЧИКОВ */
        .dev-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 35px;
            margin-bottom: 40px;
        }

        /* КАРТОЧКА РАЗРАБОТЧИКА */
        .dev-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 110px;
        }

        /* КРУГЛАЯ ОБЕРТКА ДЛЯ АВАТАРКИ */
        .avatar-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #000000;
            /* Фиолетовый неон */
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
            border: 2px solid rgba(138, 43, 226, 0.3);
            margin-bottom: 12px;
            overflow: hidden; /* Обрезает картинку, чтобы она оставалась круглой */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Сама картинка внутри круга */
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Заставляет картинку заполнить круг без искажения пропорций */
            display: block;
        }

        .avatar-box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.9);
        }

        /* Текст */
        .nickname {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .role {
            font-size: 11px;
            color: #8e8eb2;
            line-height: 1.4;
        }

        /* БЛОК С КНОПКАМИ-ССЫЛКАМИ */
        .links-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .link-button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            text-decoration: none;
            color: #ffffff;
            transition: background 0.2s, border-color 0.2s;
        }

        .link-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(138, 43, 226, 0.4);
        }

        .link-button .title {
            font-size: 15px;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .link-button .desc {
            font-size: 12px;
            color: #767693;
        }
    </style>
</head>
<body>

    <!-- Задний фон со звездами (ID должен быть как на главной) -->
    <div id="particles-js"></div>

    <!-- Секция с разработчиками -->
    <div class="dev-container">

        <!-- Разработчик 1 -->
        <div class="dev-card">
            <div class="avatar-box">
                <!-- В тег src вставляй путь к фотке, например ava1.png или img/ava.jpg -->
                <img src="./images/hiz.png" alt="hiz">
            </div>
            <div class="nickname">hiz</div>
            <div class="role">Создатель</div>
        </div>

        <!-- Разработчик 2 -->
        <div class="dev-card">
            <div class="avatar-box">
                <img src="./images/1mm0rtaL.png" alt="hiz">
            </div>
            <div class="nickname">1mm0rtaL</div>
            <div class="role">Посудомойка</div>
        </div>


    </div>

    <!-- Кнопки -->
    <div class="links-container">
        <a href="/" class="link-button">
            <span class="title">Главная страница</span>
            <span class="desc">Вернуться на сайт</span>
        </a>

        <a href="https://github.com" target="_blank" class="link-button">
            <span class="title">Репозиторий проекта</span>
            <span class="desc">Исходный код на GitHub</span>
        </a>

        <a href="https://t.me" target="_blank" class="link-button">
            <span class="title">Telegram</span>
            <span class="desc">Связаться напрямую</span>
        </a>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ ДЛЯ ЗВЕЗД -->
    <!-- Скопируй эти две строчки из самого низа своей главной страницы index.html -->
    <script src="particles.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
